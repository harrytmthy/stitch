name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: API check
        run: ./gradlew apiCheck --continue --stacktrace

      - name: Run Spotless
        if: ${{ !cancelled() }}
        run: ./gradlew spotlessCheck --init-script gradle/init.gradle.kts --no-configuration-cache --continue --stacktrace

      - name: Run JVM and JS tests
        if: ${{ !cancelled() }}
        run: ./gradlew test :stitch:jvmTest :stitch:jsNodeTest :stitch:jsBrowserTest --continue --stacktrace

      - name: Upload test results (XML)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/build/test-results/**
            **/build/reports/tests/**

  multiplatform:
    name: Multiplatform tests and published artifacts
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check API and test iOS runtime
        run: ./gradlew :stitch:apiCheck :stitch:iosSimulatorArm64Test --continue --no-configuration-cache --stacktrace

      - name: Read test publication version
        id: publication
        if: ${{ !cancelled() }}
        run: |
          version="$(./gradlew :stitch:properties -PversionSuffix=-kmp-ci --quiet --console=plain | sed -n 's/^version: //p')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish isolated test artifacts
        id: publish
        if: ${{ !cancelled() && steps.publication.outcome == 'success' }}
        run: >-
          ./gradlew publishToMavenLocal -PversionSuffix=-kmp-ci
          -Dmaven.repo.local="$RUNNER_TEMP/stitch-maven"
          --init-script tests/kmp-consumer/local-publication.init.gradle.kts
          --no-configuration-cache --stacktrace

      - name: Test published runtime and generated graphs
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: >-
          ./gradlew -p tests/kmp-consumer -PstitchVersion="${{ steps.publication.outputs.version }}"
          -Dmaven.repo.local="$RUNNER_TEMP/stitch-maven"
          jvmTest jsNodeTest jsBrowserTest iosSimulatorArm64Test compileKotlinIosArm64 compileKotlinIosX64
          --continue --no-configuration-cache --stacktrace

      - name: Upload multiplatform test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: multiplatform-test-results
          path: |
            stitch/build/test-results/**
            tests/kmp-consumer/build/test-results/**
